{% extends "base.html" %}

{% block content %}
<div id="success-bar"></div>
<div id="error-bar" >Something went wrong</div>


<div id="players">
    <h2>Room {{room}}</h2>
    <ul>

    </ul>
{% if is_host %}

    <div class="start_game" onclick="Start_game()">
        Start Game
    </div>

{% endif %}
</div>


<h1 id="msg"></h1>
<p id="click"></p>
<div class="container" id="players-select">

    <h2>Select a Player</h2>
    <h3></h3>

    <!-- Add players here using JS -->
    <div id="player-list"></div>

    <button id="continue-btn">Continue</button>

</div>


<script type="text/javascript">
    let player_selected
    const messages = document.getElementById("#messages");
    const sockit = io();
    sockit.emit("room-page-joined")
    let player_id
    let target_id

    const playerList = document.getElementById("player-list");

    function addPlayer(name, info = "",id) {
        const player = document.createElement("div");
        player.className = "player";

        player.innerHTML = `
            <div class="player-name">${name}</div>
            <div class="player-info">${info}</div>
        `;
        player.Data = {
            "id":id,
        };
        console.log("Object_data",player.Data["id"]);


        player.addEventListener("click", () => {
            // Remove selection from all players
            document.querySelectorAll(".player").forEach(p => {
                p.classList.remove("selected");
            });

            // Select clicked player
            player.classList.add("selected");

            // Run your function
            playerSelected(player.Data["id"]);
        });

        playerList.appendChild(player);
    }

    function playerSelected(playerId) {
        target_id = playerId
        sockit.emit("temp-selection",{"selection":playerId})
        console.log("Selected:", playerId);
    }

    // Example players


    const showPlayer = (players) =>{
        const ul = document.querySelector("#players ul");
        ul.innerHTML = "";
        for (player of players){
            let li = document.createElement("li");
            li.textContent = player;
            ul.appendChild(li);
        }

    }

    function Start_game(){
        console.log("Start_game")
        sockit.emit("Start_game")
    }

    function showError(message){
    const bar = document.getElementById("error-bar");
    bar.textContent = message;
    bar.classList.add("show");

    setTimeout(()=>{
        bar.classList.remove("show");
    },10000);
}

    function showSuccess(message){
    const bar = document.getElementById("success-bar");
    bar.textContent = message;
    bar.classList.add("show");

    setTimeout(()=>{
        bar.classList.remove("show");
    },10000);
}

    function ready(){
        console.log("ready");
        sockit.emit("ready");
        document.removeEventListener("click", ready);
    }

    // function submit_move(){
    //     if (!player_selected){
    //         showError("select a player")

    //     } else {
    //         sockit.
    //     }
    // }
    sockit.on("player_id",(data) =>{
        player_id = data.data
        console.log(player_id)
    })


    sockit.on("error",(data) =>{
        showError(data.message)
    })
    sockit.on("success",(data) =>{
        showSuccess(data.message)
    });
    sockit.on("started",(data)=>{
        document.getElementById("msg").innerHTML = `you Are a ${data["type"]}`
    })
    sockit.on("player-joined",(data) =>{
        console.log("player joined")
        showPlayer(data.players)
    });

    sockit.on("Game-on",(data) => {
        console.log(player_id)
        console.log(data[player_id])
        document.getElementById("players").style.display = 'none'
        document.getElementById("msg").innerHTML = `you Are a ${data[player_id]}`;
        document.getElementById("click").innerHTML=`click on the screen if you are ready`
        document.addEventListener("click",ready)
    })

    sockit.on("round_start",(data) =>{
        console.log(document.getElementById("msg"))
        document.getElementById("msg").innerHTML = `${data["msg"]}`
        console.log(data["types"][player_id])
        if (data["types"][player_id]=="citizen"){
            let p = document.getElementById("click")
            p.textContent = "Click on the screen to continue"
            document.addEventListener("click",ready)
        }else{
            const continue_btn = document.querySelector("#continue-btn")
            console.log(continue_btn)
            continue_btn.addEventListener("click",submit_move)
            
            if(data["types"][player_id]=="mafia"){
                document.querySelector(".container h2").textContent = "choose the player you want to Eliminate";
            }
            if(data["types"][player_id]=="doctor"){
                document.querySelector(".container h2").textContent = "choose the player you want to Protect";
            }
            if(data["types"][player_id]=="elder"){
                document.querySelector(".container h2").textContent = "choose the player you want to Ask about";
            }
            document.getElementById("msg").style.display = 'none'
            document.getElementById("click").style.display = 'none'
            document.getElementById("players-select").style.display = "block"
            console.log("h2")
            console.log("player_id: ",player_id)
            console.log(data["players"])
            
            i = 0
            for (const player of Object.keys(data["players"][player_id])){
                console.log(player)
                console.log(data["players"][player_id][player]["name"])
                i++;
                addPlayer(data["players"][player_id][player]["name"], "Level 15 Mage",data["players"][player_id][player]["id"]);
            } 
        }
    })
    sockit.on("partner-selection",(data) => {
        console.log(data["selection"])
        let h3 = document.querySelector(".container h3");
        h3.textContent = `Your partner selection: ${data["selection"]}`
    })

    function submit_move(){
        console.log(`submit_move: id: ${player_id}, target_id: ${target_id}`)
        sockit.emit("submit_move",{"id":player_id,"target_id":target_id})
    }

    sockit.on("cancel_btn",() => {
        console.log("cancel_btn")
    })
    
    sockit.on("wait",() => {
        console.log("wait")
    })

    sockit.on("round_end",() => {
        console.log("cancel_btn")
    })
</script>
{% endblock content %}
